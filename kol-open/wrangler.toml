name = "kol-open"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

# ── D1：文字欄位 ───────────────────────────────
# 建立後請把 `wrangler d1 create kol-open-db` 印出的 database_id 貼到下面。
[[d1_databases]]
binding       = "FORM_DB"
database_name = "kol-open-db"
database_id   = "貼上你的 database_id"

# ── R2：證件與簽名圖檔 ─────────────────────────
[[r2_buckets]]
binding     = "FORM_BUCKET"
bucket_name = "kol-open-files"

# ── Turnstile（防機器人）─────────────────────
# 在 Cloudflare 後台 → Turnstile 取得 secret，於 Pages 專案 Settings → 環境變數設定：
#   TURNSTILE_SECRET = 你的 secret key
# 前端 public/index.html 內的 data-sitekey 也要換成你的 site key。
